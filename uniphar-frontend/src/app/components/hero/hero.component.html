<section style="position: relative; min-height: 400px; background: #1b264f; display: flex; align-items: center; padding: 60px 32px;">
  <img *ngIf="imageUrl" [src]="imageUrl" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.3;" />
  <div style="position: relative; max-width: 700px;">
    <h1 style="color: white; font-size: 40px; font-weight: 600; margin: 0 0 16px;">{{ heading }}</h1>
    <p style="color: rgba(255,255,255,0.8); font-size: 18px; margin: 0 0 24px;">{{ subtext }}</p>
    <a *ngIf="ctaText" [routerLink]="ctaLink" style="background: white; color: #1b264f; padding: 12px 28px; border-radius: 4px; text-decoration: none; font-weight: 500;">{{ ctaText }}</a>
  </div>
</section>
