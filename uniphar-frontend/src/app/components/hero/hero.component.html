<!-- Skeleton -->
<section *ngIf="loading; else realHero"
  style="position: relative; min-height: 400px; background: #1b264f; display: flex; align-items: center; padding: 60px 32px; overflow: hidden;">
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.07) 50%, transparent 100%); animation: shimmer 1.4s infinite;"></div>
  <div style="position: relative; max-width: 700px; display: flex; flex-direction: column; gap: 16px;">
    <div style="width: 480px; max-width: 90%; height: 44px; background: rgba(255,255,255,0.15); border-radius: 4px;"></div>
    <div style="width: 320px; max-width: 70%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 4px;"></div>
    <div style="width: 260px; max-width: 60%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 4px;"></div>
    <div style="width: 140px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 8px;"></div>
  </div>
</section>

<!-- Real hero -->
<ng-template #realHero>
  <section [style.background]="imageUrl ? 'transparent' : '#1b264f'" style="position: relative; min-height: 400px; display: flex; align-items: center; padding: 60px 32px;">
    <img *ngIf="imageUrl" [src]="imageUrl" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;" />
    <div style="position: relative; max-width: 700px;">
      <h1 style="color: white; font-size: 40px; font-weight: 600; margin: 0 0 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.6);">{{ heading }}</h1>
      <p style="color: rgba(255,255,255,0.9); font-size: 18px; margin: 0 0 24px; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">{{ subtext }}</p>
      <a *ngIf="ctaText && isExternal(ctaLink)" 
        [href]="ctaLink" 
        target="_blank"
        style="background: white; color: #1b264f; padding: 12px 28px; border-radius: 4px; text-decoration: none; font-weight: 500;">
        {{ ctaText }}
      </a>
      <a *ngIf="ctaText && !isExternal(ctaLink)" 
        [routerLink]="ctaLink"
        style="background: white; color: #1b264f; padding: 12px 28px; border-radius: 4px; text-decoration: none; font-weight: 500;">
        {{ ctaText }}
      </a>
    </div>
  </section>
</ng-template>
