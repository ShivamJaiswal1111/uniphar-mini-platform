<form [formGroup]="form" (ngSubmit)="onSubmit()" style="max-width: 440px; margin: 0 auto;">
  <div style="margin-bottom: 20px;">
    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1b264f; font-size: 14px;">Name</label>
    <input formControlName="name" type="text"
           style="width: 100%; padding: 11px 14px; border: 1px solid #d5d5d5; border-radius: 6px; font-size: 14px; box-sizing: border-box; transition: border-color 0.15s;"
           onfocus="this.style.borderColor='#1b264f'" onblur="this.style.borderColor='#d5d5d5'" />
    <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" style="color: #c0392b; font-size: 13px; margin-top: 6px;">
      Name is required.
    </div>
  </div>

  <div style="margin-bottom: 20px;">
    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1b264f; font-size: 14px;">Email</label>
    <input formControlName="email" type="email"
           style="width: 100%; padding: 11px 14px; border: 1px solid #d5d5d5; border-radius: 6px; font-size: 14px; box-sizing: border-box; transition: border-color 0.15s;"
           onfocus="this.style.borderColor='#1b264f'" onblur="this.style.borderColor='#d5d5d5'" />
    <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" style="color: #c0392b; font-size: 13px; margin-top: 6px;">
      Enter a valid email address.
    </div>
  </div>

  <div style="margin-bottom: 24px;">
    <label style="display: block; margin-bottom: 6px; font-weight: 600; color: #1b264f; font-size: 14px;">Message</label>
    <textarea formControlName="message" rows="5"
              style="width: 100%; padding: 11px 14px; border: 1px solid #d5d5d5; border-radius: 6px; font-size: 14px; box-sizing: border-box; resize: vertical; font-family: inherit; transition: border-color 0.15s;"
              onfocus="this.style.borderColor='#1b264f'" onblur="this.style.borderColor='#d5d5d5'"></textarea>
    <div *ngIf="form.get('message')?.invalid && form.get('message')?.touched" style="color: #c0392b; font-size: 13px; margin-top: 6px;">
      Message is required.
    </div>
  </div>

  <button type="submit" [disabled]="submitting"
          style="background: #1b264f; color: white; padding: 13px 32px; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.15s;"
          [style.opacity]="submitting ? 0.6 : 1">
    {{ submitting ? 'Sending...' : 'Send Message' }}
  </button>

  <div *ngIf="successMessage" style="color: #27ae60; background: #eafaf1; border-radius: 6px; padding: 12px 16px; margin-top: 20px; font-size: 14px;">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" style="color: #c0392b; background: #fdecea; border-radius: 6px; padding: 12px 16px; margin-top: 20px; font-size: 14px;">
    {{ errorMessage }}
  </div>
</form>
