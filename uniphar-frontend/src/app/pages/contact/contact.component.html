<app-navbar />
<div *ngIf="loading" class="page-fade">
  <div class="skeleton" style="height: 400px; border-radius: 0;"></div>
  <div style="padding: 60px 32px; max-width: 800px; margin: 0 auto; display: grid; gap: 16px;">
    <div class="skeleton" style="height: 24px; width: 60%;"></div>
    <div class="skeleton" style="height: 24px; width: 40%;"></div>
  </div>
</div>
<div *ngIf="error" style="padding: 60px 32px; text-align: center; color: red;">{{ error }}</div>
<div *ngIf="contact && !loading" class="page-fade">
  <app-hero heading="Contact Us" subtext="Get in touch with the Uniphar team"></app-hero>
  <section style="padding: 60px 32px; max-width: 800px; margin: 0 auto;">
    <div style="display: grid; gap: 24px;">
      <div *ngIf="contact.address" style="display: flex; gap: 16px; align-items: flex-start;">
        <strong style="min-width: 80px; color: #1b264f;">Address</strong>
        <span style="color: #444;">{{ contact.address }}</span>
      </div>
      <div *ngIf="contact.phone" style="display: flex; gap: 16px; align-items: center;">
        <strong style="min-width: 80px; color: #1b264f;">Phone</strong>
        <span style="color: #444;">{{ contact.phone }}</span>
      </div>
      <div *ngIf="contact.email" style="display: flex; gap: 16px; align-items: center;">
        <strong style="min-width: 80px; color: #1b264f;">Email</strong>
        <a [href]="'mailto:' + contact.email" style="color: #0066cc;">{{ contact.email }}</a>
      </div>
    </div>
  </section>

  <section style="padding: 0 32px 60px; max-width: 800px; margin: 0 auto;" *ngIf="contact.officeImageUrl || (contact.latitude != null && contact.longitude != null)">
    <h2 style="font-size: 22px; font-weight: 600; color: #1b264f; margin-bottom: 16px;">Our Office</h2>
    <div style="display: flex; gap: 24px; flex-wrap: wrap;">
      <div style="flex: 1; min-width: 280px;" *ngIf="contact.officeImageUrl">
        <img [src]="contact.officeImageUrl" alt="Office"
             style="width: 100%; height: 280px; object-fit: cover; border-radius: 8px; display: block;" />
      </div>
      <div style="flex: 1; min-width: 280px; height: 280px; border-radius: 8px; overflow: hidden;"
           *ngIf="contact.latitude != null && contact.longitude != null">
        <app-map
          [latitude]="contact.latitude"
          [longitude]="contact.longitude"
          [zoom]="15"
          [popupText]="contact.address">
        </app-map>
      </div>
    </div>
  </section>
</div>
<app-footer />
