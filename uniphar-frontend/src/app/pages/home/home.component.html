<app-navbar />
<div *ngIf="loading" class="page-fade" style="padding: 0;">
  <div class="skeleton" style="height: 400px; border-radius: 0;"></div>
  <div style="padding: 60px 32px; max-width: 1200px; margin: 0 auto;">
    <div class="skeleton" style="height: 36px; width: 50%; margin-bottom: 16px;"></div>
    <div class="skeleton" style="height: 20px; width: 80%;"></div>
  </div>
</div>
<div *ngIf="error" style="padding: 60px 32px; text-align: center; color: red;">{{ error }}</div>
<div *ngIf="page && !loading" class="page-fade">
  <app-hero
    [heading]="page.heroHeading"
    [subtext]="page.heroSubtext"
    [imageUrl]="page.heroImageUrl"
    [ctaText]="page.ctaButtonText || 'Learn More'"
    [ctaLink]="page.ctaButtonLink || '/about'">
  </app-hero>

  <section style="padding: 60px 32px; max-width: 1200px; margin: 0 auto;">
    <h2 style="font-size: 28px; font-weight: 600; color: #1b264f; margin-bottom: 16px;">
      {{ page.introductionHeading }}
    </h2>
    <p style="color: #444; font-size: 16px; line-height: 1.6;" [innerHTML]="page.introductionText"></p>
  </section>

  <section *ngIf="page.featuredSections?.length" style="padding: 0 32px 60px; max-width: 1200px; margin: 0 auto; display: flex; gap: 24px; flex-wrap: wrap;">
    <a *ngFor="let card of page.featuredSections"
      [routerLink]="getCardLink(card.linkUrl)"
      style="flex: 1; min-width: 260px; border: 1px solid #ddd; border-radius: 8px; padding: 24px; text-decoration: none; color: inherit; display: block; cursor: pointer; transition: box-shadow 0.2s ease, transform 0.2s ease;"
      onmouseover="this.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'; this.style.transform='translateY(-2px)'"
      onmouseout="this.style.boxShadow='none'; this.style.transform='translateY(0)'">
      <h3 style="font-size: 20px; font-weight: 600; color: #1b264f; margin-bottom: 8px;">{{ card.heading }}</h3>
      <p style="color: #444;">{{ card.description }}</p>
    </a>
  </section>
</div>
<app-footer />
