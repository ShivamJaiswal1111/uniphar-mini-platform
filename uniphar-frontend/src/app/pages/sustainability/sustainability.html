<app-navbar />
<div *ngIf="loading" class="page-fade">
  <div class="skeleton" style="height: 400px; border-radius: 0;"></div>
  <div style="padding: 60px 32px; max-width: 900px; margin: 0 auto; display: grid; gap: 16px;">
    <div class="skeleton" style="height: 24px; width: 60%;"></div>
    <div class="skeleton" style="height: 24px; width: 40%;"></div>
  </div>
</div>
<div *ngIf="error" style="padding: 60px 32px; text-align: center; color: red;">{{ error }}</div>
<div *ngIf="data && !loading" class="page-fade">
  <app-hero 
    [heading]="data.heroHeading || 'Sustainability'" 
    [subtext]="data.heroSubtext || 'Our commitment to ESG'">
  </app-hero>

  <section style="padding: 60px 32px; max-width: 900px; margin: 0 auto;">
    <div [innerHTML]="sanitizedOverview"></div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin-top: 40px;">
      <div *ngFor="let goal of data.goals" style="background: #f5f5f5; padding: 24px; border-radius: 8px;">
        <h3 style="color: #1b264f; margin: 0 0 8px;">{{ goal.title }}</h3>
        <p style="color: #444; margin: 0 0 12px;">{{ goal.description }}</p>
        <p style="font-size: 14px; color: #666; margin: 0 0 8px;"><strong>Target:</strong> {{ goal.target }}</p>
        <div style="background: #ddd; height: 8px; border-radius: 4px; overflow: hidden;">
          <div [style.width.%]="goal.progress" style="background: #0066cc; height: 100%;"></div>
        </div>
      </div>
    </div>

    <a *ngIf="data.esgReportUrl" [href]="data.esgReportUrl" target="_blank"
       style="display:inline-block; margin-top:40px; padding:10px 20px; background:#1b264f; color:white; border-radius:4px; text-decoration:none;">
       Download ESG Report
    </a>
  </section>
</div>
<app-footer />
