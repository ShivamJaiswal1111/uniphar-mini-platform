<app-navbar />
<div *ngIf="loading" class="page-fade">
  <div class="skeleton" style="height: 400px; border-radius: 0;"></div>
  <div style="padding: 60px 32px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">
    <div class="skeleton" style="height: 120px; border-radius: 8px;"></div>
    <div class="skeleton" style="height: 120px; border-radius: 8px;"></div>
    <div class="skeleton" style="height: 120px; border-radius: 8px;"></div>
  </div>
</div>
<div *ngIf="error" style="padding: 60px 32px; text-align: center; color: red;">{{ error }}</div>

<div *ngIf="overview && !loading" class="page-fade">
  
  <app-hero
    [heading]="overview.heroHeading || 'Investor Relations'"
    [subtext]="overview.heroSubtext || 'Uniphar represents a strong combination of scale, growth and profitability'"
    [imageUrl]="overview.heroImageUrl || ''">
  </app-hero>
  <app-breadcrumb [crumbs]="overview?.breadcrumbs || []" />
  <section style="padding: 60px 32px; background: #f5f5f5;">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto;">
      <div *ngFor="let stat of overview.keyStats" style="background: white; padding: 32px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
        <div style="font-size: 36px; font-weight: 700; color: #1b264f; margin-bottom: 8px;">{{ stat.value }}</div>
        <div style="font-size: 14px; color: #666;">{{ stat.label }}</div>
      </div>
    </div>
  </section>
  <section *ngIf="sanitizedTicker" style="padding: 60px 32px; max-width: 1200px; margin: 0 auto;">
    <h2 style="font-size: 28px; font-weight: 600; color: #1b264f; margin-bottom: 32px;">Stock Ticker</h2>
    <div style="width: 100%; height: 600px; overflow: hidden; position: relative;">
      <div style="position: absolute; inset: 0;" [innerHTML]="sanitizedTicker"></div>
    </div>
  </section>
  <section style="padding: 60px 32px; max-width: 1200px; margin: 0 auto;">
    <h2 style="font-size: 28px; font-weight: 600; color: #1b264f; margin-bottom: 32px;">FY {{ overview.year }} Documents</h2>
    <div style="display: flex; gap: 16px; flex-wrap: wrap;">
      <a *ngIf="overview.annualReportUrl" [href]="overview.annualReportUrl" target="_blank"
         style="background: #1b264f; color: white; padding: 16px 24px; border-radius: 4px; text-decoration: none;">
         Download Annual Report
      </a>
      <a *ngIf="overview.presentationUrl" [href]="overview.presentationUrl" target="_blank"
         style="background: #0066cc; color: white; padding: 16px 24px; border-radius: 4px; text-decoration: none;">
         Download Presentation
      </a>
    </div>
  </section>
</div>
<app-footer />
