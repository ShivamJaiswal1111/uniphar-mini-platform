<app-navbar />
<div *ngIf="loading" style="padding: 60px 32px; text-align: center; color: #666;">Loading...</div>
<div *ngIf="error" style="padding: 60px 32px; text-align: center; color: red;">{{ error }}</div>
<ng-container *ngIf="overview && !loading">
  <app-hero
    heading="Investor Relations"
    subtext="Uniphar represents a strong combination of scale, growth and profitability">
  </app-hero>
  <section style="padding: 60px 32px; background: #f5f5f5;">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto;">
      <div *ngFor="let stat of overview.keyStats" style="background: white; padding: 32px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
        <div style="font-size: 36px; font-weight: 700; color: #1b264f; margin-bottom: 8px;">{{ stat.value }}</div>
        <div style="font-size: 14px; color: #666;">{{ stat.label }}</div>
      </div>
    </div>
  </section>
  <section style="padding: 60px 32px; max-width: 1200px; margin: 0 auto;">
    <h2 style="font-size: 28px; font-weight: 600; color: #1b264f; margin-bottom: 32px;">FY {{ overview.year }} Documents</h2>
    <div style="display: flex; gap: 16px;">
      <a [href]="overview.annualReportUrl" target="_blank" style="background: #1b264f; color: white; padding: 12px 24px; border-radius: 4px; text-decoration: none;">Download Annual Report</a>
      <a [href]="overview.presentationUrl" target="_blank" style="background: #0066cc; color: white; padding: 12px 24px; border-radius: 4px; text-decoration: none;">Download Presentation</a>
    </div>
  </section>
</ng-container>
<app-footer />
