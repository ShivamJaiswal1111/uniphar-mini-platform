<app-navbar></app-navbar>

<!-- Page Header — always visible, no data needed -->
<section style="background: #1b264f; padding: 60px 32px;">
  <div style="max-width: 1200px; margin: 0 auto;">
    <h1 style="color: white; font-size: 36px; font-weight: 600; margin: 0 0 12px;">Blog</h1>
    <p style="color: rgba(255,255,255,0.75); font-size: 16px; margin: 0;">
      Medical insights and updates from Uniphar and our legacy archive
    </p>
  </div>
</section>

<!-- Skeleton cards — shown while loading -->
<app-breadcrumb [crumbs]="[{title: 'Home', url: '/'}, {title: 'Blog', url: null}]" />
<section *ngIf="loading" style="padding: 60px 32px; background: #f5f5f5;">
  <div style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">
    <div *ngFor="let i of [1,2,3,4,5,6]"
      style="background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">

      <!-- Image placeholder -->
      <div class="skeleton" style="height: 180px; border-radius: 0;"></div>

      <!-- Content placeholder -->
      <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px;">
        <!-- Badge -->
        <div class="skeleton" style="height: 20px; width: 80px; border-radius: 12px;"></div>
        <!-- Title -->
        <div class="skeleton" style="height: 16px; width: 90%;"></div>
        <div class="skeleton" style="height: 16px; width: 70%;"></div>
        <!-- Subtext -->
        <div class="skeleton" style="height: 13px; width: 50%; margin-top: 4px;"></div>
      </div>

    </div>
  </div>
</section>

<!-- Error -->
<div *ngIf="error" style="padding: 60px 32px; text-align: center; color: #c00;">
  {{ error }}
</div>

<!-- Real posts grid — only when data is ready -->
<section *ngIf="!loading && !error" class="page-fade" style="padding: 60px 32px; background: #f5f5f5;">
  <div style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px;">

    <a *ngFor="let post of posts"
       [routerLink]="['/blog', post.slug]"
       [queryParams]="{ source: getSource(post) }"
       style="background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-decoration: none; display: block; transition: transform 0.2s;"
       onmouseenter="this.style.transform='translateY(-4px)'"
       onmouseleave="this.style.transform='translateY(0)'">

      <!-- Featured Image -->
      <div style="height: 180px; background: #1b264f; overflow: hidden;">
        <img *ngIf="post.heroImageUrl"
            [src]="post.heroImageUrl"
            [alt]="post.title"
            loading="lazy"
            style="width: 100%; height: 100%; object-fit: cover;" />
        <div *ngIf="!post.heroImageUrl"
             style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
          <span style="color: rgba(255,255,255,0.3); font-size: 40px;">📄</span>
        </div>
      </div>

      <!-- Card Content -->
      <div style="padding: 20px;">

        <!-- Badge -->
        <span *ngIf="post.contentType === 'blogPost'"
              style="display: inline-block; background: #1b264f; color: white; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
          Uniphar
        </span>
        <span *ngIf="post.contentType === 'migratedBlogPost'"
              style="display: inline-block; background: #888; color: white; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
          Migrated
        </span>

        <!-- Title -->
        <h3 style="color: #1b264f; font-size: 16px; font-weight: 600; margin: 0 0 8px; line-height: 1.4;">
          {{ post.title }}
        </h3>

        <!-- Subtext -->
        <p style="color: #888; font-size: 13px; margin: 0;">
          {{ post.heroSubtext }}
        </p>

      </div>
    </a>

  </div>
</section>

<app-footer></app-footer>
